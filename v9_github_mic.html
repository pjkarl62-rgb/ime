<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IME Voice Assistant - Recording</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            padding: 20px;
            max-width: 450px;
            width: 90%;
            /* Kein Rahmen, kein Hintergrund-Kasten */
            background: transparent;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* Logo und Inhalt leicht nach oben verschieben */
            transform: translateY(-40px);
        }
        .logo {
            /* Um 50% vergrößert (Standard-Annahme z.B. von ~100px auf 150px Breite) */
            width: 150px;
            height: auto;
            margin-bottom: 25px;
            /* Keinerlei Rahmen oder Schatten */
            border: none;
            box-shadow: none;
            background: transparent;
        }
        h2 {
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        #instruction {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 25px;
            color: #ffffff;
        }
        button {
            background-color: #ff4757;
            color: white;
            border: none;
            padding: 16px 32px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #ff6b81;
        }
        #status {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            color: #a4b0be;
        }
        .pulse {
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Logo (Pfad anpassen, falls dein Bild anders heißt, z.B. logo.png) -->
        <img src="ime_logo.png" alt="IME Logo" class="logo" id="imeLogo">

        <h2>IME Sprachassistent</h2>
        <p id="instruction">Klicke auf den Button, um die Aufnahme zu starten.</p>

        <button id="recordButton" onclick="toggleRecording()">🎙️ Aufnahme starten</button>

        <div id="status"></div>
    </div>

    <script>
        const WIX_BACKEND_URL = "https://www.visions-real.com/_functions/v9_voice_upload";
        const WIX_REDIRECT_URL = "https://www.visions-real.com/pjkime";

        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;
        let audioStream = null;

        const recordButton = document.getElementById("recordButton");
        const statusDiv = document.getElementById("status");
        const instructionP = document.getElementById("instruction");

        async function toggleRecording() {
            if (!isRecording) {
                // Aufnahme starten
                try {
                    audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(audioStream, { mimeType: 'audio/webm' });

                    audioChunks = [];

                    mediaRecorder.ondataavailable = event => {
                        if (event.data.size > 0) {
                            audioChunks.push(event.data);
                        }
                    };

                    mediaRecorder.onstop = async () => {
                        instructionP.innerText = "Verarbeite Sprache...";
                        statusDiv.classList.add("pulse");

                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        await sendAudioToWix(audioBlob);
                    };

                    mediaRecorder.start();
                    isRecording = true;

                    recordButton.innerText = "⏹️ Aufnahme stoppen";
                    recordButton.style.backgroundColor = "#2ed573"; // Grün zum Stoppen
                    instructionP.innerText = "🎙️ Aufnahme läuft... Sprich jetzt!";
                    statusDiv.classList.add("pulse");

                } catch (error) {
                    console.error("Mikrofon-Fehler:", error);
                    instructionP.innerText = "Fehler beim Mikrofon-Zugriff.";
                }
            } else {
                // Aufnahme manuell stoppen
                if (mediaRecorder && mediaRecorder.state === "recording") {
                    mediaRecorder.stop();
                    isRecording = false;
                    recordButton.style.display = "none"; // Button ausblenden während der Verarbeitung

                    if (audioStream) {
                        audioStream.getTracks().forEach(track => track.stop());
                    }
                }
            }
        }

        async function sendAudioToWix(blob) {
            try {
                const formData = new FormData();
                formData.append("file", blob, "ime_audio.webm");

                statusDiv.innerText = "Sende an Server...";

                const response = await fetch(WIX_BACKEND_URL, {
                    method: "POST",
                    body: formData
                });

                const result = await response.json();

                if (!response.ok || !result.success) {
                    throw new Error(result.error || "Unbekannter Serverfehler");
                }

                statusDiv.innerText = "Erfolgreich! Leite weiter...";

                // Zurück zu Wix mit dem Transkript
                window.location.href = WIX_REDIRECT_URL + "?transcript=" + encodeURIComponent(result.transcript);

            } catch (error) {
                console.error("Upload-Fehler:", error);
                statusDiv.innerText = "Fehler: " + error.message;
                recordButton.style.display = "block";
                recordButton.innerText = "Nochmal versuchen";
                recordButton.style.backgroundColor = "#ff4757";
                isRecording = false;
            }
        }
    </script>
</body>
</html>
