<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IME Background Voice Engine</title>
<style>
html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #0b0b0b; font-family: Arial, sans-serif;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    color: #fff; text-align: center;
}
#imageContainer { width: 280px; max-width: 80vw; margin-bottom: 30px; }
#imeImage { width: 100%; border-radius: 12px; box-shadow: 0 0 25px rgba(54, 154, 196, 0.3); }
#info { font-size: 18px; color: #888; margin-bottom: 25px; padding: 0 20px; }
#returnBtn {
    background: #00FF66; color: #000; border: none; padding: 15px 30px;
    font-size: 18px; font-weight: bold; border-radius: 30px; cursor: pointer;
    box-shadow: 0 0 15px rgba(0, 255, 102, 0.4); display: none;
    transition: transform 0.2s;
}
#returnBtn:active { transform: scale(0.95); }
</style>
</head>
<body>

<div id="imageContainer">
    <img id="imeImage" src="1000_IME_NEW1.heif" alt="AI IME">
</div>
<div id="info">Allow to activate the MICROPHONE...</div>
<button id="returnBtn">🚀 Back to IME AI (Microphone is activated)</button>

<script>
let mediaStream = null;
let mediaRecorder = null;
let audioChunks = [];
const infoBox = document.getElementById("info");
const returnBtn = document.getElementById("returnBtn");
const wixFrontendUrl = "https://www.visions-real.com/pjkime";
const channel = new BroadcastChannel('ime_voice_channel');

// 1. Mikrofon beim Laden anfordern
async function initBackgroundMic() {
    try {
        mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        infoBox.innerText = "Mikrofon erfolgreich freigeschaltet! Klicke unten, um zu Wix zurückzukehren.";
        returnBtn.style.display = "block"; // Zeigt den Button an, sobald das Mic da ist
    } catch(err) {
        infoBox.innerText = "Mikrofon-Zugriff verweigert! Bitte in den Browsereinstellungen erlauben.";
    }
}

// 2. Klick auf den Button führt den Rücksprung aus (vom Nutzer aktiv ausgelöst, daher kein Popup-Blocker-Problem)
returnBtn.addEventListener("click", () => {
    window.location.href = wixFrontendUrl + "?mic=ready";
});

// 3. Horcht auf Befehle aus dem Wix-Frontend über den BroadcastChannel (während die Aufnahme läuft)
channel.onmessage = async (event) => {
    const data = event.data;
    if (!data) return;

    if (data.action === "START_RECORDING") {
        if (!mediaStream) return;
        audioChunks = [];
        mediaRecorder = new MediaRecorder(mediaStream, { mimeType: "audio/webm" });

        mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };

        mediaRecorder.onstop = async () => {
            if (audioChunks.length > 0) {
                const blob = new Blob(audioChunks, { type: "audio/webm" });
                await sendAudioToBackend(blob);
            }
        };

        mediaRecorder.start();
    }
    else if (data.action === "STOP_RECORDING") {
        if (mediaRecorder && mediaRecorder.state === "recording") {
            mediaRecorder.stop();
        }
    }
};

async function sendAudioToBackend(blob) {
    try {
        const form = new FormData();
        form.append("file", blob, "ime_audio.webm");

        const response = await fetch("https://www.visions-real.com/_functions/v9_voice_upload", {
            method: "POST",
            body: form
        });

        const result = await response.json();
        if(result && result.transcript){
            const transcript = result.transcript.trim();
            // Sobald der Text da ist, springt GitHub automatisch mit dem Text zu Wix zurück
            window.location.href = wixFrontendUrl + "?transcript=" + encodeURIComponent(transcript);
        }
    } catch(error) {
        infoBox.innerText = "Fehler beim Hochladen der Audio-Datei.";
    }
}

window.addEventListener("load", initBackgroundMic);
</script>

</body>
</html>
