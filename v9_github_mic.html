<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IME Voice Engine (Background)</title>
<style>
html, body {
    margin: 0; padding: 0; width: 100vw; height: 100vh;
    background: #ffffff; font-family: Arial, sans-serif;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    color: #333; text-align: center; user-select: none;
    box-sizing: border-box;
}
#imageContainer {
    width: 60vw;
    max-width: 600px;
    min-width: 250px;
    margin-bottom: 4vh;
}
#imeImage {
    width: 100%;
    height: auto;
    border-radius: 12px;
    box-shadow: 0 0 25px rgba(0, 0, 0, 0.15);
}
#info { font-size: 2.5vw; min-font-size: 16px; color: #555; margin-bottom: 3vh; padding: 0 2vw; }
@media (min-width: 1024px) {
    #info { font-size: 20px; }
}
#actionBtn {
    background: #00FF66; color: #000; border: none; padding: 2vh 4vw;
    font-size: 22px; font-weight: bold; border-radius: 40px; cursor: pointer;
    box-shadow: 0 0 20px rgba(0, 255, 102, 0.4); transition: transform 0.2s;
}
#actionBtn:active { transform: scale(0.95); }
</style>
</head>
<body>

<div id="imageContainer">
    <img id="imeImage" src="1000_IME_NEW1.jpg" alt="AI IME">
</div>
<div id="info">Bitte einmalig Mikrofon freigeben und verbinden</div>
<button id="actionBtn">🎤 Mikrofon aktivieren</button>

<script>
let mediaStream = null;
let mediaRecorder = null;
let audioChunks = [];
const infoBox = document.getElementById("info");
const actionBtn = document.getElementById("actionBtn");
const wixFrontendUrl = "https://www.visions-real.com/pjkime";
const channel = new BroadcastChannel('ime_voice_channel');

console.log("[GitHub Background] Engine gestartet. Warte auf Nutzer-Interaktion...");

actionBtn.addEventListener("click", async () => {
    if (!mediaStream) {
        try {
            console.log("[GitHub Background] Fordere Mikrofon-Berechtigung an...");
            mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            console.log("[GitHub Background] Mikrofon erfolgreich erhalten!");

            infoBox.innerText = "Mikrofon aktiv! Klicke nun, um Wix im neuen Tab zu öffnen.";
            actionBtn.innerText = "🚀 Wix in neuem Tab öffnen";
            return;
        } catch (err) {
            console.error("[GitHub Background] Fehler bei Mikrofon-Freigabe:", err);
            infoBox.innerText = "Mikrofon-Zugriff verweigert!";
            return;
        }
    }

    console.log("[GitHub Background] Öffne Wix im neuen Tab...");
    const openedWindow = window.open(wixFrontendUrl + "?mic=ready", "_blank");
    if (!openedWindow) {
        alert("Bitte erlaube Pop-ups für diese Seite, damit der Hintergrund-Modus funktioniert.");
    } else {
        infoBox.innerText = "IME Engine läuft unsichtbar im Hintergrund. Du kannst diesen Tab minimieren.";
        actionBtn.style.display = "none";
    }
});

// Horcht auf Start-/Stopp-Befehle aus dem Wix-Frontend
channel.onmessage = async (event) => {
    const data = event.data;
    if (!data) return;

    console.log("[GitHub Background] Broadcast empfangen:", data.action);

    if (data.action === "START_RECORDING") {
        if (!mediaStream) {
            console.warn("[GitHub Background] Aufnahme-Start ignoriert: Kein Mikrofon aktiv!");
            return;
        }
        audioChunks = [];
        mediaRecorder = new MediaRecorder(mediaStream, { mimeType: "audio/webm" });

        mediaRecorder.ondataavailable = e => {
            if (e.data.size > 0) audioChunks.push(e.data);
        };

        mediaRecorder.onstop = async () => {
            console.log("[GitHub Background] Aufnahme gestoppt. Starte Upload an Backend...", audioChunks.length, "Chunks");
            if (audioChunks.length > 0) {
                const blob = new Blob(audioChunks, { type: "audio/webm" });
                await sendAudioToBackend(blob);
            } else {
                console.warn("[GitHub Background] Keine Audiodaten vorhanden!");
            }
        };

        mediaRecorder.start();
        console.log("[GitHub Background] Recorder läuft...");
    }
    else if (data.action === "STOP_RECORDING") {
        if (mediaRecorder && mediaRecorder.state === "recording") {
            console.log("[GitHub Background] Stopp-Befehl erhalten. Beende Recorder...");
            mediaRecorder.stop();
        } else {
            console.warn("[GitHub Background] Stopp ignoriert: Recorder war nicht aktiv.");
        }
    }
};

async function sendAudioToBackend(blob) {
    try {
        console.log("[GitHub Background] Sende Fetch-Request an Wix-Backend...");
        const form = new FormData();
        form.append("file", blob, "ime_audio.webm");

        const response = await fetch("https://www.visions-real.com/_functions/v9_voice_upload", {
            method: "POST",
            body: form
        });

        console.log("[GitHub Background] Backend HTTP Status:", response.status);
        const result = await response.json();
        console.log("[GitHub Background] Backend Antwort-JSON:", result);

        if (result && result.transcript) {
            const transcript = result.transcript.trim();
            console.log("[GitHub Background] Transkript erhalten:", transcript);
            infoBox.innerText = "Transkript erfolgreich! Öffne Wix...";
            window.open(wixFrontendUrl + "?transcript=" + encodeURIComponent(transcript), "_blank");
        } else {
            console.warn("[GitHub Background] Backend hat kein Transkript zurückgeliefert:", result);
            infoBox.innerText = "Kein Text erkannt.";
        }
    } catch (error) {
        console.error("[GitHub Background] FEHLER beim Senden an das Backend:", error);
        infoBox.innerText = "Fehler beim Backend-Upload (Siehe Console).";
    }
}
</script>

</body>
</html>
