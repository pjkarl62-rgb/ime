<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IME Voice Engine (Background)</title>
<style>
html, body {
    margin: 0; padding: 0; width: 100vw; height: 100vh;
    background: #ffffff; font-family: Arial, sans-serif;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    color: #333; text-align: center; user-select: none;
    box-sizing: border-box;
}
#imageContainer {
    width: 60vw; max-width: 600px; min-width: 250px; margin-bottom: 4vh;
}
#imeImage {
    width: 100%; height: auto; border-radius: 12px;
    box-shadow: 0 0 25px rgba(0, 0, 0, 0.15);
}
#info { font-size: 20px; color: #555; margin-bottom: 3vh; padding: 0 2vw; }
#actionBtn {
    background: #00FF66; color: #000; border: none; padding: 2vh 4vw;
    font-size: 22px; font-weight: bold; border-radius: 40px; cursor: pointer;
    box-shadow: 0 0 20px rgba(0, 255, 102, 0.4); transition: transform 0.2s;
}
#actionBtn:active { transform: scale(0.95); }
</style>
</head>
<body>

<div id="imageContainer">
    <img id="imeImage" src="1000_IME_NEW1.jpg" alt="AI IME">
</div>
<div id="info">Bitte einmalig Mikrofon freigeben und verbinden</div>
<button id="actionBtn">🎤 Mikrofon aktivieren</button>

<script>
let mediaStream = null;
let mediaRecorder = null;
let audioChunks = [];
const infoBox = document.getElementById("info");
const actionBtn = document.getElementById("actionBtn");
const wixFrontendUrl = "https://www.visions-real.com/pjkime";

console.log("[GitHub Background] Engine gestartet.");

// 1. Mikrofon freigeben
actionBtn.addEventListener("click", async () => {
    if (!mediaStream) {
        try {
            console.log("[GitHub Background] Fordere Mikrofon an...");
            mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            console.log("[GitHub Background] Mikrofon erfolgreich!");

            infoBox.innerText = "Mikrofon aktiv! Klicke nun, um Wix im neuen Tab zu öffnen.";
            actionBtn.innerText = "🚀 Wix in neuem Tab öffnen";
            return;
        } catch (err) {
            console.error("[GitHub Background] Mikrofon-Fehler:", err);
            infoBox.innerText = "Mikrofon-Zugriff verweigert!";
            return;
        }
    }

    console.log("[GitHub Background] Öffne Wix im neuen Tab...");
    const openedWindow = window.open(wixFrontendUrl + "?mic=ready", "_blank");
    if (!openedWindow) {
        alert("Bitte Pop-ups erlauben!");
    } else {
        infoBox.innerText = "IME Engine läuft unsichtbar im Hintergrund.";
        actionBtn.style.display = "none";
    }
});

// 2. Permanent den localStorage überwachen (Ersatz für BroadcastChannel)
setInterval(async () => {
    const command = localStorage.getItem("ime_command");

    if (command === "START_RECORDING" && mediaRecorder && mediaRecorder.state === "inactive") {
        localStorage.removeItem("ime_command"); // Befehl sofort löschen, damit er nicht doppelt feuert
        console.log("[GitHub Background] Befehl erhalten: START_RECORDING");

        audioChunks = [];
        mediaRecorder.start();
        infoBox.innerText = "Aufnahme läuft (über Wix gesteuert)...";
    }
    else if (command === "STOP_RECORDING" && mediaRecorder && mediaRecorder.state === "recording") {
        localStorage.removeItem("ime_command");
        console.log("[GitHub Background] Befehl erhalten: STOP_RECORDING");

        mediaRecorder.stop();
        infoBox.innerText = "Verarbeite Audio...";
    }
}, 200); // Prüft alle 200 Millisekunden

// Wenn das Mikrofon bereit ist, MediaRecorder initialisieren
function setupRecorder() {
    if (!mediaStream) return;
    mediaRecorder = new MediaRecorder(mediaStream, { mimeType: "audio/webm" });

    mediaRecorder.ondataavailable = e => {
        if (e.data.size > 0) audioChunks.push(e.data);
    };

    mediaRecorder.onstop = async () => {
        console.log("[GitHub Background] Recorder gestoppt. Sende an Backend...");
        if (audioChunks.length > 0) {
            const blob = new Blob(audioChunks, { type: "audio/webm" });
            await sendAudioToBackend(blob);
        }
    };
}

// Sobald MediaStream da ist, Recorder vorbereiten (wird nach Klick aufgerufen)
const originalGetUserMedia = navigator.mediaDevices.getUserMedia;
// Wir hängen uns an den Erfolg der Freigabe
actionBtn.addEventListener("click", () => {
    if (mediaStream && !mediaRecorder) {
        setupRecorder();
    }
});

async function sendAudioToBackend(blob) {
    try {
        const form = new FormData();
        form.append("file", blob, "ime_audio.webm");

        const response = await fetch("https://www.visions-real.com/_functions/v9_voice_upload", {
            method: "POST",
            body: form
        });

        const result = await response.json();
        console.log("[GitHub Background] Backend Antwort:", result);

        if (result && result.transcript) {
            const transcript = result.transcript.trim();
            // Text in den localStorage schreiben, damit Wix ihn abholen kann, oder direkt Tab öffnen
            localStorage.setItem("ime_transcript", transcript);
            window.open(wixFrontendUrl + "?transcript=" + encodeURIComponent(transcript), "_blank");
            infoBox.innerText = "Bereit für den nächsten Befehl.";
        } else {
            infoBox.innerText = "Kein Text erkannt.";
        }
    } catch (error) {
        console.error("[GitHub Background] Backend Fehler:", error);
        infoBox.innerText = "Fehler beim Upload.";
    }
}
</script>

</body>
</html>
