<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IME Voice Assistant - Recording</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff !important;
            color: #222222;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container {
            text-align: center;
            padding: 20px;
            max-width: 500px;
            width: 90%;
            background: transparent;
            display: flex;
            flex-direction: column;
            align-items: center;
            transform: translateY(-20px);
        }
        .logo-link {
            cursor: pointer;
            display: inline-block;
            transition: transform 0.2s;
        }
        .logo-link:hover {
            transform: scale(1.03);
        }
        .logo {
            width: 65vw;
            max-width: 1350px;
            height: auto;
            margin-bottom: 25px;
            border: none;
            box-shadow: none;
            background: transparent;
            object-fit: contain;
        }
        h2 {
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #111111;
        }
        #instruction {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 25px;
            color: #333333;
        }
        button {
            color: white;
            border: none;
            outline: none;
            padding: 16px 36px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.3s;
        }
        button:active {
            transform: scale(0.98);
        }
        .btn-start {
            background-color: #2ed573;
            box-shadow: 0 0 15px rgba(46, 213, 115, 0.5);
            animation: glowGreen 2s infinite;
        }
        .btn-stop {
            background-color: #ff4757;
            box-shadow: 0 0 15px rgba(255, 71, 87, 0.6);
            animation: glowRed 1.5s infinite;
        }
        #status {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            color: #555555;
        }
        @keyframes glowGreen {
            0% { box-shadow: 0 0 10px rgba(46, 213, 115, 0.4); transform: scale(1); }
            50% { box-shadow: 0 0 22px rgba(46, 213, 115, 0.8); transform: scale(1.03); }
            100% { box-shadow: 0 0 10px rgba(46, 213, 115, 0.4); transform: scale(1); }
        }
        @keyframes glowRed {
            0% { box-shadow: 0 0 10px rgba(255, 71, 87, 0.4); transform: scale(1); }
            50% { box-shadow: 0 0 25px rgba(255, 71, 87, 0.9); transform: scale(1.04); }
            100% { box-shadow: 0 0 10px rgba(255, 71, 87, 0.4); transform: scale(1); }
        }
        .pulse-text {
            animation: pulseText 1.5s infinite;
        }
        @keyframes pulseText {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="container">
        <a onclick="returnToWix()" class="logo-link" title="Click to return">
            <img src="1000_IME_NEW1_white.jpg" alt="IME Logo" class="logo" id="imeLogo">
        </a>

        <h2>IME Voice Assistant</h2>
        <p id="instruction">Checking microphone status...</p>

        <!-- Standardmäßig da, wird aber ausgeblendet, wenn die Erlaubnis bereits permanent da ist -->
        <button id="recordButton" class="btn-start" onclick="toggleRecording()" style="display: none;">🎙️ Start Recording</button>

        <div id="status"></div>
    </div>

    <script>
        const WIX_BACKEND_URL = "https://www.visions-real.com/_functions/v9_voice_upload";
        const WIX_REDIRECT_URL = "https://www.visions-real.com/pjkime";

        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;
        let audioStream = null;

        const recordButton = document.getElementById("recordButton");
        const statusDiv = document.getElementById("status");
        const instructionP = document.getElementById("instruction");

        // Beim Laden der Seite prüfen, ob das Mikrofon im Browser bereits dauerhaft erlaubt wurde
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                if (navigator.permissions && navigator.permissions.query) {
                    const permissionStatus = await navigator.permissions.query({ name: 'microphone' });

                    if (permissionStatus.state === 'granted') {
                        // Erlaubnis ist bereits da! Direkt bereit machen oder automatisch starten
                        instructionP.innerText = "Microphone ready. Click to record.";
                        recordButton.style.display = "block"; // Button anzeigen, aber ohne erneutes Pop-up
                    } else {
                        // Noch nicht erlaubt -> Button anzeigen für den ersten Klick
                        instructionP.innerText = "Click the button to start recording.";
                        recordButton.style.display = "block";
                    }

                    // Auf Änderungen der Erlaubnis lauschen
                    permissionStatus.onchange = () => {
                        console.log("Permission status changed to:", permissionStatus.state);
                    };
                } else {
                    recordButton.style.display = "block";
                    instructionP.innerText = "Click the button to start recording.";
                }
            } catch (e) {
                console.log("Permissions API not fully supported, falling back.");
                recordButton.style.display = "block";
                instructionP.innerText = "Click the button to start recording.";
            }
        });

        function returnToWix() {
            window.location.href = WIX_REDIRECT_URL;
        }

        async function toggleRecording() {
            if (!isRecording) {
                try {
                    audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(audioStream, { mimeType: 'audio/webm' });

                    audioChunks = [];

                    mediaRecorder.ondataavailable = event => {
                        if (event.data.size > 0) {
                            audioChunks.push(event.data);
                        }
                    };

                    mediaRecorder.onstop = async () => {
                        instructionP.innerText = "Processing speech...";
                        statusDiv.classList.add("pulse-text");

                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        await sendAudioToWix(audioBlob);
                    };

                    mediaRecorder.start();
                    isRecording = true;

                    recordButton.innerText = "⏹️ Stop Recording";
                    recordButton.className = "btn-stop";
                    instructionP.innerText = "🎙️ Recording in progress... Speak now!";
                    statusDiv.classList.add("pulse-text");

                } catch (error) {
                    console.error("Microphone error:", error);
                    instructionP.innerText = "Microphone access blocked or denied.";
                    recordButton.style.display = "block";
                }
            } else {
                if (mediaRecorder && mediaRecorder.state === "recording") {
                    mediaRecorder.stop();
                    isRecording = false;
                    recordButton.style.display = "none";

                    if (audioStream) {
                        audioStream.getTracks().forEach(track => track.stop());
                    }
                }
            }
        }

        async function sendAudioToWix(blob) {
            try {
                const formData = new FormData();
                formData.append("file", blob, "ime_audio.webm");

                statusDiv.innerText = "Sending to server...";

                const response = await fetch(WIX_BACKEND_URL, {
                    method: "POST",
                    body: formData
                });

                const result = await response.json();

                if (!response.ok || !result.success) {
                    throw new Error(result.error || "Unknown server error");
                }

                statusDiv.innerText = "Success! Redirecting...";

                window.location.replace(WIX_REDIRECT_URL + "?transcript=" + encodeURIComponent(result.transcript));

            } catch (error) {
                console.error("Upload error:", error);
                statusDiv.innerText = "Error: " + error.message;
                recordButton.style.display = "block";
                recordButton.innerText = "Try Again";
                recordButton.className = "btn-start";
                isRecording = false;
            }
        }
    </script>
</body>
</html>
