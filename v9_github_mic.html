<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IME Voice Engine</title>
<style>
html, body {
    margin: 0; padding: 0; width: 100vw; height: 100vh;
    background: #ffffff; font-family: Arial, sans-serif;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    color: #333; text-align: center; user-select: none;
    box-sizing: border-box;
}
#imageContainer {
    width: 60vw;
    max-width: 600px;
    min-width: 250px;
    margin-bottom: 4vh;
}
#imeImage {
    width: 100%;
    height: auto;
    border-radius: 12px;
    box-shadow: 0 0 25px rgba(0, 0, 0, 0.15);
}
#info {
    font-size: 2.2vw;
    min-font-size: 16px;
    color: #555;
    margin-bottom: 3vh;
    padding: 0 2vw;
}
@media (min-width: 1024px) {
    #info { font-size: 20px; }
}
.btn {
    background: #00FF66; color: #000; border: none; padding: 2.5vh 4.5vw;
    font-size: 22px; font-weight: bold; border-radius: 40px; cursor: pointer;
    box-shadow: 0 0 20px rgba(0, 255, 102, 0.4); transition: transform 0.1s;
}
.btn:active { transform: scale(0.95); }
#recordContainer { display: none; flex-direction: column; align-items: center; }
</style>
</head>
<body>

<div id="imageContainer">
    <img id="imeImage" src="1000_IME_NEW1.jpg" alt="AI IME">
</div>

<div id="info">Bitte einmalig das Mikrofon freigeben</div>

<!-- Schritt 1: Mikrofon-Freigabe Button -->
<button id="authBtn" class="btn">🎤 Mikrofon aktivieren</button>

<!-- Schritt 2: Aufnahme-Container (erscheint erst nach Freigabe) -->
<div id="recordContainer">
    <button id="micBtn" class="btn">🔴 Aufnahme starten</button>
</div>

<script>
let mediaStream = null;
let mediaRecorder = null;
let audioChunks = [];
const infoBox = document.getElementById("info");
const authBtn = document.getElementById("authBtn");
const recordContainer = document.getElementById("recordContainer");
const micBtn = document.getElementById("micBtn");
const wixFrontendUrl = "https://www.visions-real.com/pjkime";

// 1. Mikrofon-Freigabe per echtem Nutzer-Klick auslösen
authBtn.addEventListener("click", async () => {
    try {
        infoBox.innerText = "Frage Mikrofon-Berechtigung an...";
        mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });

        // Bei Erfolg: Verstecke den Aktivierungs-Button und zeige den Aufnahme-Button
        authBtn.style.display = "none";
        recordContainer.style.display = "flex";
        infoBox.innerText = "Mikrofon aktiv! Drücke zum Aufnehmen.";
    } catch (err) {
        infoBox.innerText = "Mikrofon-Zugriff verweigert! Bitte in den Browsereinstellungen erlauben.";
    }
});

// 2. Aufnahme Logik (Klick zum Starten / Klick zum Stoppen)
let isRecording = false;

micBtn.addEventListener("click", async () => {
    if (!mediaStream) return;

    if (!isRecording) {
        // START DER AUFNAHME
        isRecording = true;
        audioChunks = [];
        mediaRecorder = new MediaRecorder(mediaStream, { mimeType: "audio/webm" });

        mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };

        mediaRecorder.onstop = async () => {
            infoBox.innerText = "Verarbeite Audio...";
            if (audioChunks.length > 0) {
                const blob = new Blob(audioChunks, { type: "audio/webm" });
                await sendAudioToBackend(blob);
            }
        };

        mediaRecorder.start();
        micBtn.style.backgroundColor = "#ff3333";
        micBtn.style.color = "#fff";
        micBtn.innerText = "⏹️ Aufnahme stoppen";
        infoBox.innerText = "Aufnahme läuft... (Nochmal drücken zum Stoppen)";
    } else {
        // STOPP DER AUFNAHME
        isRecording = false;
        mediaRecorder.stop();
        micBtn.style.display = "none";
    }
});

async function sendAudioToBackend(blob) {
    try {
        const form = new FormData();
        form.append("file", blob, "ime_audio.webm");

        const response = await fetch("https://www.visions-real.com/_functions/v9_voice_upload", {
            method: "POST",
            body: form
        });

        const result = await response.json();
        if (result && result.transcript) {
            const transcript = result.transcript.trim();
            infoBox.innerText = "Fertig! Kehre zu Wix zurück...";
            window.location.href = wixFrontendUrl + "?transcript=" + encodeURIComponent(transcript);
        } else {
            infoBox.innerText = "Kein Text erkannt. Bitte erneut versuchen.";
            micBtn.style.display = "block";
            micBtn.style.backgroundColor = "#00FF66";
            micBtn.style.color = "#000";
            micBtn.innerText = "🔴 Erneut aufnehmen";
        }
    } catch (error) {
        infoBox.innerText = "Fehler beim Backend-Upload.";
        micBtn.style.display = "block";
    }
}
</script>

</body>
</html>
