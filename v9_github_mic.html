<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IME Voice Engine</title>
<style>
html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #0b0b0b; font-family: Arial, sans-serif;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    color: #fff; text-align: center; user-select: none;
}
#imageContainer { width: 280px; max-width: 80vw; margin-bottom: 30px; }
#imeImage { width: 100%; border-radius: 12px; box-shadow: 0 0 25px rgba(54, 154, 196, 0.3); }
#info { font-size: 18px; color: #888; margin-bottom: 25px; padding: 0 20px; }
#actionBtn {
    background: #00FF66; color: #000; border: none; padding: 18px 35px;
    font-size: 20px; font-weight: bold; border-radius: 40px; cursor: pointer;
    box-shadow: 0 0 20px rgba(0, 255, 102, 0.5); transition: transform 0.2s;
}
#actionBtn:active { transform: scale(0.95); }
</style>
</head>
<body>

<div id="imageContainer">
    <img id="imeImage" src="1000_IME_NEW1.jpg" alt="AI IME">
</div>
<div id="info">Bitte einmalig Mikrofon freigeben und verbinden</div>
<button id="actionBtn">🎤 Mikrofon aktivieren</button>

<script>
let mediaStream = null;
let mediaRecorder = null;
let audioChunks = [];
const infoBox = document.getElementById("info");
const actionBtn = document.getElementById("actionBtn");
const wixFrontendUrl = "https://www.visions-real.com/pjkime";
const channel = new BroadcastChannel('ime_voice_channel');

// Durch den echten Klick des Benutzers auf den Button erlaubt der Browser (auch Firefox) sofort das Mikrofon und das Öffnen von Tabs
actionBtn.addEventListener("click", async () => {
    if (!mediaStream) {
        try {
            // Mikrofon anfordern
            mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            infoBox.innerText = "Mikrofon aktiv! Klicke nun, um zu Wix zurückzukehren.";
            actionBtn.innerText = "🚀 Zurück zu Wix";
            return; // Nächster Klick öffnet Wix
        } catch (err) {
            infoBox.innerText = "Mikrofon-Zugriff verweigert! Bitte in Browser-Einstellungen erlauben.";
            return;
        }
    }

    // Wenn Mikrofon bereits da ist, öffnet dieser Klick Wix im neuen Tab (garantiert ohne Popup-Blocker)
    const newWindow = window.open(wixFrontendUrl + "?mic=ready", "_blank");
    if (!newWindow) {
        // Fallback falls der Browser es blockiert hat
        window.location.href = wixFrontendUrl + "?mic=ready";
    }
});

// Horcht währenddessen auf Start-/Stopp-Befehle aus dem Wix-Frontend
channel.onmessage = async (event) => {
    const data = event.data;
    if (!data) return;

    if (data.action === "START_RECORDING") {
        if (!mediaStream) return;
        audioChunks = [];
        mediaRecorder = new MediaRecorder(mediaStream, { mimeType: "audio/webm" });

        mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };

        mediaRecorder.onstop = async () => {
            if (audioChunks.length > 0) {
                const blob = new Blob(audioChunks, { type: "audio/webm" });
                await sendAudioToBackend(blob);
            }
        };

        mediaRecorder.start();
    }
    else if (data.action === "STOP_RECORDING") {
        if (mediaRecorder && mediaRecorder.state === "recording") {
            mediaRecorder.stop();
        }
    }
};

async function sendAudioToBackend(blob) {
    try {
        const form = new FormData();
        form.append("file", blob, "ime_audio.webm");

        const response = await fetch("https://www.visions-real.com/_functions/v9_voice_upload", {
            method: "POST",
            body: form
        });

        const result = await response.json();
        if(result && result.transcript){
            const transcript = result.transcript.trim();
            // Öffnet Wix im neuen Tab mit dem fertigen Text (durch echten Funktionskontext stabiler)
            window.open(wixFrontendUrl + "?transcript=" + encodeURIComponent(transcript), "_blank");
        }
    } catch(error) {
        infoBox.innerText = "Fehler beim Hochladen der Audio-Datei.";
    }
}
</script>

</body>
</html>
