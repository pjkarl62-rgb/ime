<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IME Background Voice Engine</title>
<style>
html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #0b0b0b; font-family: Arial, sans-serif;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
}
#imageContainer { width: 280px; max-width: 80vw; margin-bottom: 30px; }
#imeImage { width: 100%; border-radius: 12px; box-shadow: 0 0 25px rgba(54, 154, 196, 0.3); }
#info { font-size: 18px; color: #888; text-align: center; padding: 0 20px; }
</style>
</head>
<body>

<div id="imageContainer">
    <img id="imeImage" src="1000_IME_NEW1.jpg" alt="AI IME">
</div>
<div id="info">Initializing Microphone...</div>

<script>
let mediaStream = null;
let mediaRecorder = null;
let audioChunks = [];
const infoBox = document.getElementById("info");
const wixFrontendUrl = "https://www.visions-real.com/pjkime";
const channel = new BroadcastChannel('ime_voice_channel');

// 1. Mikrofon beim initialen Laden einmalig anfordern
async function initBackgroundMic() {
    try {
        mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        infoBox.innerText = "Microphone active! Opening Wix Frontend...";

        // Öffnet Wix im neuen Tab und signalisiert, dass das Mic bereit ist
        setTimeout(() => {
            window.open(wixFrontendUrl + "?mic=ready", "_blank");
            infoBox.innerText = "IME Engine running silently in background. Ready for Wix commands.";
        }, 1000);

    } catch(err) {
        infoBox.innerText = "Microphone access blocked! Please allow permissions.";
    }
}

// 2. Horcht auf Befehle aus dem Wix-Frontend über den BroadcastChannel
channel.onmessage = async (event) => {
    const data = event.data;
    if (!data) return;

    if (data.action === "START_RECORDING") {
        if (!mediaStream) return;
        audioChunks = [];
        mediaRecorder = new MediaRecorder(mediaStream, { mimeType: "audio/webm" });

        mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };

        mediaRecorder.onstop = async () => {
            if (audioChunks.length > 0) {
                const blob = new Blob(audioChunks, { type: "audio/webm" });
                await sendAudioToBackend(blob);
            }
        };

        mediaRecorder.start();
        infoBox.innerText = "Recording active (triggered from Wix)...";
    }
    else if (data.action === "STOP_RECORDING") {
        if (mediaRecorder && mediaRecorder.state === "recording") {
            mediaRecorder.stop();
            infoBox.innerText = "Processing audio...";
        }
    }
};

async function sendAudioToBackend(blob) {
    try {
        const form = new FormData();
        form.append("file", blob, "ime_audio.webm");

        const response = "https://www.visions-real.com/_functions/v9_voice_upload";
        const fetchRes = await fetch(response, {
            method: "POST",
            body: form
        });

        const result = await fetchRes.json();
        if(result && result.transcript){
            const transcript = result.transcript.trim();
            infoBox.innerText = "Sending transcript to Wix...";

            // Öffnet Wix im neuen Tab mit dem fertigen Text
            window.open(wixFrontendUrl + "?transcript=" + encodeURIComponent(transcript), "_blank");
        } else {
            infoBox.innerText = "Engine Ready. Waiting for Wix...";
        }
    } catch(error) {
        infoBox.innerText = "Error uploading audio. Engine Ready.";
    }
}

window.addEventListener("load", initBackgroundMic);
</script>

</body>
</html>
