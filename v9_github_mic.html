<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IME Voice Assistant - Recording</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff !important; /* Erzwingt den weißen Hintergrund */
            color: #222222;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            padding: 20px;
            max-width: 450px;
            width: 90%;
            background: transparent;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* Nach oben verschoben */
            transform: translateY(-40px);
        }
        .logo-link {
            cursor: pointer;
            display: inline-block;
            transition: transform 0.2s;
        }
        .logo-link:hover {
            transform: scale(1.03);
        }
        .logo {
            /* Um 50% vergrößert (auf 150px Breite) */
            width: 150px;
            height: auto;
            margin-bottom: 25px;
            border: none;
            box-shadow: none;
            background: transparent;
        }
        h2 {
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #111111;
        }
        #instruction {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 25px;
            color: #333333;
        }
        button {
            background-color: #ff4757;
            color: white;
            border: none;
            padding: 16px 32px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.3s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
        button:hover {
            background-color: #ff6b81;
        }
        #status {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            color: #555555;
        }
        .pulse {
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Logo als Klick-Link zurück zu Wix -->
        <a onclick="returnToWix()" class="logo-link" title="Click to return">
            <img src="1000_IME_NEW1.jpg" alt="IME Logo" class="logo" id="imeLogo">
        </a>

        <h2>IME Voice Assistant</h2>
        <p id="instruction">Click the button to start recording.</p>

        <button id="recordButton" onclick="toggleRecording()">🎙️ Start Recording</button>

        <div id="status"></div>
    </div>

    <script>
        const WIX_BACKEND_URL = "https://www.visions-real.com/_functions/v9_voice_upload";
        const WIX_REDIRECT_URL = "https://www.visions-real.com/pjkime";

        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;
        let audioStream = null;

        const recordButton = document.getElementById("recordButton");
        const statusDiv = document.getElementById("status");
        const instructionP = document.getElementById("instruction");

        function returnToWix() {
            window.location.href = WIX_REDIRECT_URL;
        }

        async function toggleRecording() {
            if (!isRecording) {
                // Start recording
                try {
                    audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(audioStream, { mimeType: 'audio/webm' });

                    audioChunks = [];

                    mediaRecorder.ondataavailable = event => {
                        if (event.data.size > 0) {
                            audioChunks.push(event.data);
                        }
                    };

                    mediaRecorder.onstop = async () => {
                        instructionP.innerText = "Processing speech...";
                        statusDiv.classList.add("pulse");

                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        await sendAudioToWix(audioBlob);
                    };

                    mediaRecorder.start();
                    isRecording = true;

                    recordButton.innerText = "⏹️ Stop Recording";
                    recordButton.style.backgroundColor = "#2ed573"; // Green to stop
                    instructionP.innerText = "🎙️ Recording in progress... Speak now!";
                    statusDiv.classList.add("pulse");

                } catch (error) {
                    console.error("Microphone error:", error);
                    instructionP.innerText = "Microphone access error.";
                }
            } else {
                // Stop recording manually
                if (mediaRecorder && mediaRecorder.state === "recording") {
                    mediaRecorder.stop();
                    isRecording = false;
                    recordButton.style.display = "none"; // Hide button during processing

                    if (audioStream) {
                        audioStream.getTracks().forEach(track => track.stop());
                    }
                }
            }
        }

        async function sendAudioToWix(blob) {
            try {
                const formData = new FormData();
                formData.append("file", blob, "ime_audio.webm");

                statusDiv.innerText = "Sending to server...";

                const response = await fetch(WIX_BACKEND_URL, {
                    method: "POST",
                    body: formData
                });

                const result = await response.json();

                if (!response.ok || !result.success) {
                    throw new Error(result.error || "Unknown server error");
                }

                statusDiv.innerText = "Success! Redirecting...";

                // Return to Wix with transcript
                window.location.href = WIX_REDIRECT_URL + "?transcript=" + encodeURIComponent(result.transcript);

            } catch (error) {
                console.error("Upload error:", error);
                statusDiv.innerText = "Error: " + error.message;
                recordButton.style.display = "block";
                recordButton.innerText = "Try Again";
                recordButton.style.backgroundColor = "#ff4757";
                isRecording = false;
            }
        }
    </script>
</body>
</html>
