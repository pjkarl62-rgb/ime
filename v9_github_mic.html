<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IME Background Engine</title>
<style>
html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden; background: #0b0b0b;
    font-family: Arial, sans-serif;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
}
#imageContainer {
    width: 280px; max-width: 80vw;
    display: flex; justify-content: center; align-items: center;
}
#imeImage {
    width: 100%; height: auto; border-radius: 12px;
    box-shadow: 0 0 25px rgba(54, 154, 196, 0.3);
}
#info {
    margin-top: 30px; font-size: 20px; color: #888; text-align: center;
}
</style>
</head>
<body>

<div id="imageContainer">
    <img id="imeImage" src="1000_IME_NEW1.jpg" alt="AI IME">
</div>
<div id="info">IME Engine Ready in Background</div>

<script>
let mediaStream = null;
let mediaRecorder = null;
let audioChunks = [];
const infoBox = document.getElementById("info");

// 1. Mikrofon beim Laden der GitHub-Seite einmalig initialisieren & freigeben
async function initBackgroundMic() {
    try {
        mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        infoBox.innerText = "IME Engine Active - Waiting for Wix...";

        // Signalisiere Wix, dass GitHub bereit ist
        if (window.opener) {
            window.opener.postMessage({ type: "IME_READY" }, "*");
        }
    } catch(err) {
        infoBox.innerText = "Microphone access blocked in browser!";
    }
}

// 2. Start- und Stopp-Befehle aus dem Wix-Frontend abfangen
window.addEventListener("message", async (event) => {
    const data = event.data;
    if (!data) return;

    if (data.action === "START_RECORDING") {
        if (!mediaStream) return;
        audioChunks = [];
        mediaRecorder = new MediaRecorder(mediaStream, { mimeType: "audio/webm" });

        mediaRecorder.ondataavailable = e => {
            if (e.data.size > 0) audioChunks.push(e.data);
        };

        mediaRecorder.onstop = async () => {
            if (audioChunks.length > 0) {
                const blob = new Blob(audioChunks, { type: "audio/webm" });
                await sendAudioToBackend(blob);
            }
        };

        mediaRecorder.start();
        infoBox.innerText = "Recording speech from Wix...";
    }

    else if (data.action === "STOP_RECORDING") {
        if (mediaRecorder && mediaRecorder.state === "recording") {
            mediaRecorder.stop();
            infoBox.innerText = "Processing audio...";
        }
    }
});

async function sendAudioToBackend(blob) {
    try {
        const form = new FormData();
        form.append("file", blob, "ime_audio.webm");

        const response = await fetch("https://www.visions-real.com/_functions/v2_voice_upload", {
            method: "POST",
            body: form
        });

        const result = await response.json();
        if(result && result.transcript){
            const transcript = result.transcript.trim();
            // Schickt den fertigen Text an das Wix-Frontend zurück
            if (window.opener) {
                window.opener.postMessage({ type: "IME_TRANSCRIPT", text: transcript }, "*");
            }
        }
        infoBox.innerText = "Engine Ready - Waiting for Wix...";
    } catch(error) {
        infoBox.innerText = "Error uploading audio";
    }
}

window.addEventListener("load", initBackgroundMic);
</script>

</body>
</html>
